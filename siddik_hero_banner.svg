          <tspan fill="#C084FC">await</tspan>
          <tspan fill="#FFFFFF"> SQLiteService.</tspan>
          <tspan fill="#38BDF8">syncLocalToCloud</tspan>
          <tspan fill="#FFFFFF">();</tspan>
