          <tspan fill="#C084FC">Future</tspan>
          <tspan fill="#FFFFFF">&lt;</tspan>
          <tspan fill="#38BDF8">void</tspan>
          <tspan fill="#FFFFFF">&gt; </tspan>
          <tspan fill="#34D399">syncOfflineData</tspan>
          <tspan fill="#FFFFFF">() </tspan>
          <tspan fill="#C084FC">async</tspan>
          <tspan fill="#FFFFFF"> {</tspan>
