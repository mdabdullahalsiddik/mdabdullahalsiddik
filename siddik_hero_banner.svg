          <tspan fill="#C084FC">final</tspan>
          <tspan fill="#FFFFFF"> orders = &lt;</tspan>
          <tspan fill="#F59E0B">Order</tspan>
          <tspan fill="#FFFFFF">&gt;[].</tspan>
          <tspan fill="#38BDF8">obs</tspan>
          <tspan fill="#FFFFFF">;</tspan>
        </text>

